plugins {
    id 'java'
    id 'eclipse'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = '1.0.0'
group = 'net.jaams.weaponry_cc'

base {
    archivesName = 'jaams_weaponry_cc'
}

project.ext.mcVersion = '1.21.1'

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '21.1.235'

    validateAccessTransformers = true

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        jaams_weaponry_cc {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
    maven { name = 'NeoForged'; url = 'https://maven.neoforged.net/releases' }
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
    maven {
        name = 'CurseForge'
        url = 'https://maven.curseforge.com'
        content {
            includeGroup 'curse.maven'
        }
    }
}

dependencies {

    // Blueprint
    implementation 'curse.maven:blueprint-382216:8397829'

    // Jaam's Weaponry
    implementation 'curse.maven:jaams-weaponry-1361012:8595277'

    // Caverns & Chasms
    implementation 'curse.maven:caverns-and-chasms-438005:8155745'

    // JEI
    implementation 'curse.maven:jei-238222:7391682'
}

jar {
    archiveFileName = "${base.archivesName.get()}-${project.version}-neoforge-${mcVersion}.jar"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
